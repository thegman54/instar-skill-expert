<!--
  Expert Knowledge Admin Panel
  Self-contained Alpine.js component. Loaded into a modal by the profiles page.
  Expects: container div has data-admin-slug attribute set to the profile slug.
  Calls: /api/expert/{slug}/entries (GET, POST), /api/expert/{slug}/entries/{id} (PUT, DELETE)
-->
<div x-data="expertAdmin()" x-init="init()" class="flex flex-col h-full" style="min-height: 500px;">

    <!-- Header -->
    <div class="flex items-center justify-between mb-4">
        <div>
            <h3 class="text-lg font-semibold text-white">Expert Knowledge</h3>
            <div class="flex items-center gap-3">
                <span class="text-xs font-mono text-gray-400" x-text="slug"></span>
                <span class="text-xs text-gray-500" x-text="entries.length + ' entries across ' + Object.keys(categories).length + ' categories'"></span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <!-- Tab buttons -->
            <button @click="activeTab = 'entries'"
                class="px-3 py-1.5 text-xs rounded transition-colors"
                :class="activeTab === 'entries' ? 'bg-amber-700 text-white' : 'text-gray-400 hover:text-white bg-gray-700'">
                Entries
            </button>
            <button @click="activeTab = 'suggestions'; loadProposals()"
                class="relative px-3 py-1.5 text-xs rounded transition-colors"
                :class="activeTab === 'suggestions' ? 'bg-emerald-700 text-white' : 'text-gray-400 hover:text-white bg-gray-700'">
                Suggestions
                <span x-show="proposalCount > 0"
                    class="absolute -top-1.5 -right-1.5 bg-emerald-500 text-white text-[10px] font-bold rounded-full h-4 min-w-[16px] flex items-center justify-center px-1"
                    x-text="proposalCount"></span>
            </button>
            <button x-show="activeTab === 'entries'" @click="startCreate()"
                class="px-3 py-1.5 text-xs bg-amber-700 hover:bg-amber-600 text-white rounded transition-colors">+ New Entry</button>
        </div>
    </div>

    <!-- Suggestions Tab -->
    <div x-show="activeTab === 'suggestions'" x-cloak class="flex-1 min-h-0 overflow-y-auto">
        <div x-show="proposals.length === 0" class="text-center text-gray-500 py-12">
            <svg class="h-10 w-10 mx-auto mb-3 text-gray-700" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 0 0 1.5-.189m-1.5.189a6.01 6.01 0 0 1-1.5-.189m3.75 7.478a12.06 12.06 0 0 1-4.5 0m3.75 2.383a14.406 14.406 0 0 1-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 1 0-7.517 0c.85.493 1.509 1.333 1.509 2.316V18" />
            </svg>
            <p class="text-sm">No pending suggestions</p>
            <p class="text-xs mt-1">Flag a conversation in the cockpit to trigger expert analysis.</p>
        </div>
        <div class="space-y-3">
            <template x-for="p in proposals" :key="p.id">
                <div class="bg-gray-900 border border-gray-700 rounded-lg p-4">
                    <!-- Proposal header -->
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded"
                            :class="p.action === 'create' ? 'bg-emerald-900/60 text-emerald-400' : 'bg-amber-900/60 text-amber-400'"
                            x-text="p.action.toUpperCase()"></span>
                        <span class="text-sm text-white font-mono" x-text="p.topic"></span>
                        <span x-show="p.category" class="text-[10px] px-1.5 py-0.5 bg-gray-700 text-gray-400 rounded" x-text="p.category"></span>
                        <span class="text-[10px] text-gray-600 ml-auto" x-text="new Date(p.created_at).toLocaleString()"></span>
                    </div>
                    <!-- Rationale -->
                    <div class="bg-gray-800 rounded p-2 mb-3 text-xs text-gray-300 leading-relaxed">
                        <span class="text-gray-500 font-medium">Rationale:</span> <span x-text="p.rationale"></span>
                    </div>
                    <!-- Summary if present -->
                    <p x-show="p.summary" class="text-xs text-gray-400 mb-2" x-text="p.summary"></p>
                    <!-- Content comparison for updates -->
                    <div x-show="p.action === 'update' && p.existing_content" class="grid grid-cols-2 gap-2 mb-3">
                        <div>
                            <div class="text-[10px] text-red-400 mb-1 font-medium">Current</div>
                            <pre class="text-[11px] text-gray-400 bg-gray-800 rounded p-2 overflow-auto max-h-48 whitespace-pre-wrap font-mono" x-text="p.existing_content"></pre>
                        </div>
                        <div>
                            <div class="text-[10px] text-emerald-400 mb-1 font-medium">Proposed</div>
                            <pre class="text-[11px] text-gray-300 bg-gray-800 rounded p-2 overflow-auto max-h-48 whitespace-pre-wrap font-mono" x-text="p.content"></pre>
                        </div>
                    </div>
                    <!-- Content for creates -->
                    <div x-show="p.action === 'create'" class="mb-3">
                        <pre class="text-[11px] text-gray-300 bg-gray-800 rounded p-2 overflow-auto max-h-48 whitespace-pre-wrap font-mono" x-text="p.content"></pre>
                    </div>
                    <!-- Tags/refs -->
                    <div class="flex items-center gap-2 mb-3">
                        <template x-for="tag in (p.tags || [])" :key="tag">
                            <span class="text-[10px] px-1.5 py-0.5 bg-gray-700 text-gray-400 rounded" x-text="tag"></span>
                        </template>
                        <span x-show="p.refs && p.refs.length" class="text-[10px] text-gray-600"
                            x-text="'→ ' + (p.refs || []).join(', ')"></span>
                    </div>
                    <!-- Actions -->
                    <div class="flex justify-end gap-2">
                        <button @click="rejectProposal(p.id)"
                            class="px-3 py-1.5 text-xs text-gray-400 hover:text-red-400 border border-gray-700 hover:border-red-800 rounded transition-colors">
                            Reject
                        </button>
                        <button @click="approveProposal(p.id)"
                            class="px-3 py-1.5 text-xs bg-emerald-700 hover:bg-emerald-600 text-white rounded transition-colors">
                            Approve
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Entries Tab -->
    <div x-show="activeTab === 'entries'" class="flex gap-4 flex-1 min-h-0">

        <!-- Category Sidebar -->
        <div class="w-44 flex-shrink-0 overflow-y-auto">
            <button @click="activeCategory = null"
                class="w-full text-left px-3 py-1.5 text-xs rounded mb-1 transition-colors"
                :class="activeCategory === null ? 'bg-amber-900/50 text-amber-300' : 'text-gray-400 hover:text-white'">
                All Categories
            </button>
            <template x-for="(topics, cat) in categories" :key="cat">
                <button @click="activeCategory = cat"
                    class="w-full text-left px-3 py-1.5 text-xs rounded mb-1 transition-colors flex justify-between"
                    :class="activeCategory === cat ? 'bg-amber-900/50 text-amber-300' : 'text-gray-400 hover:text-white'">
                    <span x-text="cat"></span>
                    <span class="text-gray-600" x-text="topics.length"></span>
                </button>
            </template>
        </div>

        <!-- Topic List + Editor -->
        <div class="flex-1 flex flex-col min-w-0">

            <!-- Editor (create/edit) -->
            <div x-show="editing" x-cloak class="mb-4 bg-gray-900 border border-gray-600 rounded-lg p-4">
                <div class="grid grid-cols-3 gap-3 mb-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Topic <span class="text-red-400">*</span></label>
                        <input type="text" x-model="form.topic" placeholder="rollback_procedure"
                            :disabled="editingId !== null"
                            class="w-full px-2 py-1.5 bg-gray-800 border border-gray-600 rounded text-white text-xs focus:border-amber-500 focus:outline-none disabled:opacity-50">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Category <span class="text-red-400">*</span></label>
                        <input type="text" x-model="form.category" placeholder="deployments"
                            class="w-full px-2 py-1.5 bg-gray-800 border border-gray-600 rounded text-white text-xs focus:border-amber-500 focus:outline-none"
                            list="category-suggestions">
                        <datalist id="category-suggestions">
                            <template x-for="cat in Object.keys(categories)" :key="cat">
                                <option :value="cat"></option>
                            </template>
                        </datalist>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Priority</label>
                        <select x-model="form.priority"
                            class="w-full px-2 py-1.5 bg-gray-800 border border-gray-600 rounded text-white text-xs focus:border-amber-500 focus:outline-none">
                            <option value="critical">critical</option>
                            <option value="high">high</option>
                            <option value="normal">normal</option>
                            <option value="low">low</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Summary <span class="text-red-400">*</span></label>
                        <input type="text" x-model="form.summary" placeholder="One-liner for the CLAUDE.md index"
                            class="w-full px-2 py-1.5 bg-gray-800 border border-gray-600 rounded text-white text-xs focus:border-amber-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Tags <span class="text-gray-600">(comma-separated)</span></label>
                        <input type="text" x-model="form.tags" placeholder="deploy, production, emergency"
                            class="w-full px-2 py-1.5 bg-gray-800 border border-gray-600 rounded text-white text-xs focus:border-amber-500 focus:outline-none">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="block text-xs text-gray-400 mb-1">Refs <span class="text-gray-600">(other topic names, comma-separated)</span></label>
                    <input type="text" x-model="form.refs" placeholder="alert_triage, monitoring_setup"
                        class="w-full px-2 py-1.5 bg-gray-800 border border-gray-600 rounded text-white text-xs focus:border-amber-500 focus:outline-none">
                </div>
                <div class="mb-3">
                    <label class="block text-xs text-gray-400 mb-1">Content <span class="text-red-400">*</span> <span class="text-gray-600">(markdown — full instructions, procedures, decision trees)</span></label>
                    <textarea x-model="form.content" rows="12" placeholder="## Procedure&#10;&#10;### Step 1&#10;..."
                        class="w-full px-3 py-2 bg-gray-800 border border-gray-600 rounded text-white text-xs font-mono focus:border-amber-500 focus:outline-none resize-y leading-relaxed"></textarea>
                </div>
                <div class="flex justify-end gap-2">
                    <button @click="editing = false; editingId = null" class="px-3 py-1.5 text-xs text-gray-400 hover:text-white">Cancel</button>
                    <button @click="saveEntry()"
                        class="px-3 py-1.5 text-xs bg-amber-700 hover:bg-amber-600 text-white rounded"
                        x-text="editingId ? 'Update' : 'Create'"></button>
                </div>
                <p x-show="formError" class="text-xs text-red-400 mt-2" x-text="formError"></p>
            </div>

            <!-- Topic List -->
            <div x-show="!editing" class="flex-1 overflow-y-auto space-y-1">
                <template x-for="entry in filteredEntries" :key="entry.id">
                    <div class="flex items-start gap-3 bg-gray-900/50 rounded px-3 py-2.5 group hover:bg-gray-900/80 transition-colors cursor-pointer"
                        @click="editEntry(entry)">
                        <div class="flex-shrink-0 mt-0.5">
                            <span class="inline-block h-2 w-2 rounded-full"
                                :class="{
                                    'bg-red-400': entry.priority === 'critical',
                                    'bg-orange-400': entry.priority === 'high',
                                    'bg-gray-400': entry.priority === 'normal',
                                    'bg-gray-600': entry.priority === 'low',
                                }"
                                :title="entry.priority"></span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2">
                                <span class="text-sm text-white font-mono" x-text="entry.topic"></span>
                                <span class="text-[10px] px-1.5 py-0.5 bg-amber-900/40 text-amber-400 rounded" x-text="entry.category"></span>
                            </div>
                            <p class="text-xs text-gray-400 mt-0.5" x-text="entry.summary"></p>
                            <div class="flex items-center gap-2 mt-1">
                                <template x-for="tag in entry.tags" :key="tag">
                                    <span class="text-[10px] px-1.5 py-0.5 bg-gray-700 text-gray-400 rounded" x-text="tag"></span>
                                </template>
                                <span x-show="entry.refs && entry.refs.length" class="text-[10px] text-gray-600"
                                    x-text="'→ ' + (entry.refs || []).join(', ')"></span>
                                <span class="text-[10px] text-gray-600 ml-auto"
                                    x-text="entry.content.length + ' chars'"></span>
                            </div>
                        </div>
                        <button @click.stop="deleteEntry(entry.id)"
                            class="flex-shrink-0 text-gray-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity">
                            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </template>
                <div x-show="filteredEntries.length === 0" class="text-center text-gray-500 py-8">
                    <p class="text-sm" x-text="activeCategory ? 'No entries in this category' : 'No expert entries yet'"></p>
                    <p class="text-xs mt-1">Click "+ New Entry" to add expert knowledge.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function expertAdmin() {
    return {
        slug: '',
        entries: [],
        proposals: [],
        proposalCount: 0,
        activeCategory: null,
        activeTab: 'entries',
        editing: false,
        editingId: null,
        formError: null,
        form: { topic: '', category: '', summary: '', content: '', priority: 'normal', tags: '', refs: '' },

        init() {
            this.slug = this.$el.closest('[data-admin-slug]')?.dataset.adminSlug || '';
            if (this.slug) {
                this.loadEntries();
                this.loadProposalCount();
            }
        },

        get categories() {
            const cats = {};
            for (const e of this.entries) {
                if (!cats[e.category]) cats[e.category] = [];
                cats[e.category].push(e);
            }
            return Object.fromEntries(Object.entries(cats).sort(([a], [b]) => a.localeCompare(b)));
        },

        get filteredEntries() {
            if (!this.activeCategory) return this.entries;
            return this.entries.filter(e => e.category === this.activeCategory);
        },

        startCreate() {
            this.form = { topic: '', category: this.activeCategory || '', summary: '', content: '', priority: 'normal', tags: '', refs: '' };
            this.editingId = null;
            this.formError = null;
            this.editing = true;
        },

        editEntry(entry) {
            this.form = {
                topic: entry.topic,
                category: entry.category,
                summary: entry.summary,
                content: entry.content,
                priority: entry.priority,
                tags: (entry.tags || []).join(', '),
                refs: (entry.refs || []).join(', '),
            };
            this.editingId = entry.id;
            this.formError = null;
            this.editing = true;
        },

        async loadEntries() {
            try {
                const resp = await fetch(`/api/expert/${this.slug}/entries`);
                const data = await resp.json();
                this.entries = data.entries || [];
            } catch (e) {
                console.error('Failed to load entries:', e);
                this.entries = [];
            }
        },

        async saveEntry() {
            if (!this.form.topic.trim() || !this.form.category.trim() || !this.form.summary.trim() || !this.form.content.trim()) {
                this.formError = 'Topic, category, summary, and content are required.';
                return;
            }
            const tags = this.form.tags ? this.form.tags.split(',').map(t => t.trim()).filter(Boolean) : [];
            const refs = this.form.refs ? this.form.refs.split(',').map(t => t.trim()).filter(Boolean) : [];
            const payload = { ...this.form, tags, refs };

            try {
                let resp;
                if (this.editingId) {
                    resp = await fetch(`/api/expert/${this.slug}/entries/${this.editingId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                    });
                } else {
                    resp = await fetch(`/api/expert/${this.slug}/entries`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                    });
                }
                if (resp.ok) {
                    this.editing = false;
                    this.editingId = null;
                    await this.loadEntries();
                } else {
                    const err = await resp.json();
                    this.formError = err.detail || err.error || 'Failed to save';
                }
            } catch (e) {
                this.formError = 'Error: ' + e.message;
            }
        },

        async deleteEntry(id) {
            if (!confirm('Delete this expert entry?')) return;
            try {
                await fetch(`/api/expert/${this.slug}/entries/${id}`, { method: 'DELETE' });
                await this.loadEntries();
            } catch (e) {
                alert('Error: ' + e.message);
            }
        },

        async loadProposalCount() {
            try {
                const resp = await fetch(`/api/expert/${this.slug}/proposals/count`);
                const data = await resp.json();
                this.proposalCount = data.count || 0;
            } catch (e) {
                this.proposalCount = 0;
            }
        },

        async loadProposals() {
            try {
                const resp = await fetch(`/api/expert/${this.slug}/proposals`);
                const data = await resp.json();
                this.proposals = data.proposals || [];
                this.proposalCount = this.proposals.length;
            } catch (e) {
                console.error('Failed to load proposals:', e);
                this.proposals = [];
            }
        },

        async approveProposal(id) {
            try {
                const resp = await fetch(`/api/expert/${this.slug}/proposals/${id}/approve`, { method: 'POST' });
                if (resp.ok) {
                    await this.loadProposals();
                    await this.loadEntries();
                } else {
                    const err = await resp.json();
                    alert(err.detail || 'Failed to approve');
                }
            } catch (e) {
                alert('Error: ' + e.message);
            }
        },

        async rejectProposal(id) {
            try {
                const resp = await fetch(`/api/expert/${this.slug}/proposals/${id}/reject`, { method: 'POST' });
                if (resp.ok) {
                    await this.loadProposals();
                } else {
                    const err = await resp.json();
                    alert(err.detail || 'Failed to reject');
                }
            } catch (e) {
                alert('Error: ' + e.message);
            }
        },
    };
}
</script>
